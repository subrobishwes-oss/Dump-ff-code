name: Cloud Dumper
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Merge Parts and Download Dumper
        run: |
          # ১. ফাইল জোড়া লাগানো
          cat lib.part.* > libil2cpp_new.so
          cat meta.part.* > global-metadata.dat
          
          # ২. ডাম্পার ডাউনলোড করা
          wget -q https://github.com/MlgmXyysd/Il2CppDumper-Standalone/releases/download/v6.7.41-standalone/Il2CppDumper-linux-v6.7.41.zip -O dumper.zip
          unzip dumper.zip -d dumper
          chmod +x dumper/Il2CppDumper
          
          # ৩. ডাম্প রান করা
          ./dumper/Il2CppDumper libil2cpp_new.so global-metadata.dat

      - name: Upload dump.cs
        uses: actions/upload-artifact@v4
        with:
          name: dump-file
          path: dump.cs

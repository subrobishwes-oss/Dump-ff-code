name: Cloud Dumper
on: [push, workflow_dispatch]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Merge Parts and Install Mono
        run: |
          # ফাইল জোড়া লাগানো
          cat lib.part.* > libil2cpp_new.so
          cat meta.part.* > global-metadata.dat
          
          # Mono এবং Unzip ইনস্টল করা
          sudo apt-get update -y
          sudo apt-get install -y mono-complete unzip wget
          
          # অফিসিয়াল .exe ডাম্পার ডাউনলোড করা (এটা সবচেয়ে স্ট্যাবল)
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-v6.7.40.zip -O dumper.zip
          unzip dumper.zip -d dumper

      - name: Run Dumper with Mono
        run: |
          cd dumper
          # mono দিয়ে .exe ফাইল রান করছি
          mono Il2CppDumper.exe ../libil2cpp_new.so ../global-metadata.dat

      - name: Upload dump.cs
        uses: actions/upload-artifact@v4
        with:
          name: dump-file
          path: dumper/dump.cs
